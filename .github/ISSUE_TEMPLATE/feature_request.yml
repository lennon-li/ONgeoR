name: "Feature request"
description: "Suggest an enhancement or new capability"
labels: ["enhancement"]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: "One-line summary of the requested feature."
      placeholder: "Add support for..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: "Why is this feature needed? What problem does it solve or workflow does it improve?"
    validations:
      required: false

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: "Describe the solution you would like. Include API ideas or pseudocode if helpful."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "Describe any alternative approaches or workarounds you have considered."
    validations:
      required: false
