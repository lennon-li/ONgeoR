name: "Bug report"
description: "Report a reproducible problem"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "A clear description of the bug."
      placeholder: "Describe the problem..."
    validations:
      required: true

  - type: textarea
    id: reprex
    attributes:
      label: Minimal reproducible example
      description: "Paste a self-contained reprex (use the reprex package if possible). Include any error messages."
      placeholder: |
        library(ONgeoR)
        # steps to reproduce...
    validations:
      required: true

  - type: input
    id: r_version
    attributes:
      label: R version
      description: "Output of R.version.string or sessionInfo()."
      placeholder: "e.g. R version 4.4.1 (2024-06-14)"
    validations:
      required: false

  - type: input
    id: ongeor_version
    attributes:
      label: ONgeoR version
      description: "Output of packageVersion('ONgeoR')."
      placeholder: "e.g. 0.1.0"
    validations:
      required: false

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: "What did you expect to happen?"
    validations:
      required: false

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: "What actually happened? Paste error messages or unexpected output here."
    validations:
      required: false
