name: One-off fix Shiny startup

on:
  push:
    paths:
      - .github/workflows/one-off-fix-shiny-startup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded startup fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('inst/shiny/app.R')
          app = app_path.read_text()

          old_startup = '''# plan() returns the previous plan; restore it when the app stops so a
# multisession plan does not leak into the caller's R session.
.previous_future_plan <- future::plan(future::multisession)
shiny::onStop(function() future::plan(.previous_future_plan))
'''
          new_startup = '''# Keep app sourcing side-effect free. Starting a multisession backend while
# AppDriver is still launching R, Shiny, Chrome, and the websocket produced
# intermittent startup timeouts with no Shiny error. Capture the caller's plan
# now, but create a bounded worker pool only when a user actually invokes an
# asynchronous task.
.previous_future_plan <- future::plan()
.async_plan_initialized <- FALSE
ensure_async_plan <- function() {
  if (!isTRUE(.async_plan_initialized)) {
    future::plan(future::multisession, workers = 2L)
    .async_plan_initialized <<- TRUE
  }
  invisible(NULL)
}
shiny::onStop(function() {
  if (isTRUE(.async_plan_initialized)) {
    future::plan(.previous_future_plan)
  }
})
'''
          if app.count(old_startup) != 1:
              raise SystemExit('Expected exactly one eager future-plan startup block')
          app = app.replace(old_startup, new_startup)

          invoke_names = [
              'preview_task$invoke(',
              'build_task$invoke(',
              'nearest_preview_task$invoke(',
              'nearest_task$invoke(',
          ]
          for name in invoke_names:
              count = app.count(name)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {name}, found {count}')
              app = app.replace(name, 'ensure_async_plan()\n    ' + name, 1)

          app_path.write_text(app)

          smoke_path = Path('tests/testthat/test-app-smoke.R')
          smoke = smoke_path.read_text()
          old_comment = '''# Chrome leaves a scoped temp directory behind for every launch and never
# reaps it. These accumulate at ~2 per run, and once enough of them pile up in
# TMPDIR, Chrome startup slows until AppDriver's load_timeout expires - the app
# starts fine and simply never signals ready, with no error anywhere.
#
# Measured 2026-07-20, same commit and same machine, varying only TMPDIR
# contents: with 221 leftover directories the suite failed 3 runs out of 3
# (1, 2 and 1 failures); with 0 it passed 22/22 three times running. This is
# also the "detritus in the temp directory" NOTE from R CMD check - that NOTE
# was reporting the fault, not cosmetic noise.
#
# Only directories created during this file are removed, so a developer's own
# Chrome session (which uses the same TMPDIR prefix on Linux) is left alone.
# NB: Chrome writes into TMPDIR itself, not into R's per-session tempdir()
# subdirectory, so clean dirname(tempdir()) - cleaning tempdir() finds nothing.
'''
          new_comment = '''# Chrome leaves scoped temp directories behind. Clean only directories created
# by this test file so R CMD check does not report detritus and a developer's
# own Chrome session remains untouched. This cleanup is hygiene only: repeated
# measurement disproved it as the cause of the intermittent startup timeout.
# Chrome writes into TMPDIR itself, not R's per-session tempdir(), so inspect
# dirname(tempdir()).
'''
          if smoke.count(old_comment) != 1:
              raise SystemExit('Expected stale Chrome-causality comment exactly once')
          smoke_path.write_text(smoke.replace(old_comment, new_comment))

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text()
          old_claim = '''- The "detritus in the temp directory - com.google.Chrome.*" NOTE was
  **first dismissed as cosmetic, and that was a mistake**: it was reporting
  the exact leak that caused the startup timeouts below. Resolved by the
  teardown in `test-app-smoke.R`, which removes the NOTE and the flakiness
  together. A check NOTE about leftover state is evidence about the
  environment, not a formatting complaint.
'''
          new_claim = '''- The "detritus in the temp directory - com.google.Chrome.*" NOTE identified
  a real cleanup defect, but repeated runs disproved it as the cause of the
  startup timeouts. `test-app-smoke.R` still removes only the directories it
  creates so checks remain clean; the cleanup and startup flakiness are separate.
'''
          if roadmap.count(old_claim) != 1:
              raise SystemExit('Expected contradictory ROADMAP cleanup claim exactly once')
          roadmap = roadmap.replace(old_claim, new_claim)

          old_open = '- [ ] **OPEN: browser-suite startup timeouts, cause UNKNOWN.** `AppDriver`\n'
          new_open = '- [ ] **VALIDATION PENDING: lazy future-plan startup fix.** `AppDriver`\n'
          if roadmap.count(old_open) != 1:
              raise SystemExit('Expected open startup item exactly once')
          roadmap = roadmap.replace(old_open, new_open)

          marker = '''  unchanged code**, same commit and same machine.
'''
          addition = '''  unchanged code**, same commit and same machine.
- **Fix candidate implemented 2026-07-21:** app sourcing no longer calls
  `future::plan(future::multisession)`. A bounded two-worker plan is initialized
  lazily immediately before the first `ExtendedTask` invocation and restored on
  app stop only if initialized. This removes process creation from AppDriver's
  readiness window. Keep this item open until a repeated-run browser soak test
  demonstrates that the failure rate has fallen to zero.
'''
          if roadmap.count(marker) != 1:
              raise SystemExit('Expected startup measurement marker exactly once')
          roadmap_path.write_text(roadmap.replace(marker, addition))

          workflow = Path('.github/workflows/one-off-fix-shiny-startup.yml')
          workflow.unlink()
          PY

      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(shiny): defer future workers until task invocation"
          git push
