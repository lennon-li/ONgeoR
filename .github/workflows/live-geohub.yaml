name: live-geohub

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  live-geohub:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Install ONgeoR
        run: R CMD INSTALL .
      - name: Run live GeoHub smoke test
        run: Rscript tools/live-smoke.R
